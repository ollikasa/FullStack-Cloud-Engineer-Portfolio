services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: portfolio-backend

    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "4000:4000"

    volumes:
      - sqlite-data:/app/data

    networks:
      - portfolio-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: portfolio-frontend

    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - portfolio-network


volumes:
  sqlite-data:


networks:
  portfolio-network: